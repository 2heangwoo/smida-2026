<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
  <meta name="theme-color" content="#e8e6e2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="36th SMSD">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="pages/page-001.jpg">
  <title>상명대학교 스페이스디자인 제36회 졸업전시 도록</title>
  <style>
    :root{--toolbar-h:58px;--footer-h:28px}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8e6e2;color:#222;font-family:Arial,"Noto Sans KR",sans-serif}
    button,input{font:inherit}
    .toolbar{height:var(--toolbar-h);display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#fff;border-bottom:1px solid #d7d7d7;gap:12px;position:relative;z-index:50}
    .brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
    .brand b{font-size:16px;letter-spacing:.03em}
    .brand span{font-size:10px;color:#777;letter-spacing:.08em}
    .controls{display:flex;align-items:center;gap:6px}
    .controls button,.jump-wrap{height:34px;border:1px solid #d6d6d6;background:#fff;border-radius:8px;display:inline-flex;align-items:center;justify-content:center}
    .controls button{min-width:34px;padding:0 10px;cursor:pointer}
    .controls button:hover{background:#f4f4f4}
    #pageIndicator{min-width:82px;text-align:center;font-size:13px}
    .jump-wrap{padding:0 6px;gap:3px;font-size:12px}
    .jump-wrap input{width:48px;border:0;outline:0;text-align:center;background:transparent}
    #viewer{position:relative;height:calc(100% - var(--toolbar-h) - var(--footer-h));display:flex;align-items:center;justify-content:center;overflow:hidden;padding:14px}
    #book{margin:auto}
    .page{background:#fff;overflow:hidden}
    .page img{display:block;width:100%;height:100%;object-fit:fill;user-select:none;-webkit-user-drag:none;pointer-events:none}
    .loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 14px;border-radius:9px;background:rgba(255,255,255,.92);box-shadow:0 4px 14px rgba(0,0,0,.12);font-size:13px;z-index:30}
    .footer{height:var(--footer-h);display:flex;align-items:center;justify-content:center;border-top:1px solid #d5d5d5;background:#f6f6f6;color:#777;font-size:11px}
    .stf__parent{margin:auto!important}
    .stf__block{box-shadow:0 14px 30px rgba(0,0,0,.22)}
    body.mobile-ui-hidden .toolbar{opacity:0;pointer-events:none;transform:translate(-50%,-10px)}
    @media (max-width:900px){
      :root{--toolbar-h:0px;--footer-h:0px}
      .toolbar{position:fixed;top:calc(env(safe-area-inset-top) + 7px);left:50%;width:auto;height:auto;padding:4px 5px;transform:translateX(-50%);border:0;border-radius:14px;background:rgba(255,255,255,.88);box-shadow:0 3px 14px rgba(0,0,0,.16);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:opacity .25s ease,transform .25s ease;z-index:80}
      .brand{display:none}
      .controls{gap:3px}
      .controls button{min-width:32px;height:32px;padding:0 7px;border:0;background:transparent}
      .jump-wrap{display:none}
      #pageIndicator{min-width:62px;font-size:12px}
      #fullBtn{width:34px;font-size:0}
      #fullBtn::after{content:'⛶';font-size:18px}
      #viewer{position:fixed;inset:0;width:100vw;height:100dvh;padding:max(2px,env(safe-area-inset-top)) max(2px,env(safe-area-inset-right)) max(2px,env(safe-area-inset-bottom)) max(2px,env(safe-area-inset-left))}
      .footer{display:none}
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <div class="brand"><b>36th SMSD</b><span>GRADUATION EXHIBITION</span></div>
    <div class="controls">
      <button id="prevBtn" title="이전 페이지" aria-label="이전 페이지">‹</button>
      <span id="pageIndicator">1 / 208</span>
      <button id="nextBtn" title="다음 페이지" aria-label="다음 페이지">›</button>
      <label class="jump-wrap" title="페이지 이동"><span>p.</span><input id="jumpInput" type="number" min="1" max="208" value="1"></label>
      <button id="fullBtn" title="전체화면">전체화면</button>
    </div>
  </header>

  <main id="viewer">
    <div id="book"></div>
    <div id="loading" class="loading">도록 준비 중…</div>
  </main>

  <footer class="footer">페이지 모서리 또는 페이지를 클릭·드래그해 실제 책처럼 넘길 수 있습니다.</footer>

  <script>
  (() => {
    const TOTAL = 208;
    const PAGE_W = 632;
    const PAGE_H = 836;
    const book = document.getElementById('book');
    const loading = document.getElementById('loading');
    const indicator = document.getElementById('pageIndicator');
    const jumpInput = document.getElementById('jumpInput');
    let pageFlip = null;
    let uiTimer = null;

    function loadScript(src){
      return new Promise((resolve,reject)=>{
        const s=document.createElement('script');
        s.src=src;
        s.onload=resolve;
        s.onerror=reject;
        document.head.appendChild(s);
      });
    }

    async function ensurePageFlip(){
      if(window.St && window.St.PageFlip) return;
      try{
        await loadScript('https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js');
      }catch(e){
        await loadScript('https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js');
      }
    }

    function pageSrc(n){
      return 'pages/page-' + String(n).padStart(3,'0') + '.jpg';
    }

    function buildPages(){
      const frag=document.createDocumentFragment();
      for(let i=1;i<=TOTAL;i++){
        const page=document.createElement('div');
        page.className='page';
        if(i===1 || i===TOTAL) page.dataset.density='hard';
        const img=document.createElement('img');
        img.src=pageSrc(i);
        img.alt=i+'페이지';
        img.loading=i<7?'eager':'lazy';
        img.decoding='async';
        img.draggable=false;
        page.appendChild(img);
        frag.appendChild(page);
      }
      book.appendChild(frag);
    }

    function updateIndicator(index){
      const p=Math.max(1,Math.min(TOTAL,index+1));
      indicator.textContent=p+' / '+TOTAL;
      jumpInput.value=p;
    }

    function revealMobileUI(){
      if(!window.matchMedia('(max-width:900px)').matches) return;
      document.body.classList.remove('mobile-ui-hidden');
      clearTimeout(uiTimer);
      uiTimer=setTimeout(()=>document.body.classList.add('mobile-ui-hidden'),2200);
    }

    async function init(){
      try{
        await ensurePageFlip();
        buildPages();

        pageFlip = new St.PageFlip(book,{
          width: PAGE_W,
          height: PAGE_H,
          size: 'stretch',
          minWidth: 260,
          maxWidth: PAGE_W,
          minHeight: 344,
          maxHeight: PAGE_H,
          drawShadow: true,
          flippingTime: 950,
          usePortrait: true,
          startZIndex: 0,
          autoSize: true,
          maxShadowOpacity: 0.55,
          showCover: true,
          mobileScrollSupport: false,
          swipeDistance: 20,
          clickEventForward: true,
          useMouseEvents: true,
          disableFlipByClick: false
        });

        pageFlip.on('init', e => {
          updateIndicator(e.data.page || 0);
          loading.style.display='none';
        });
        pageFlip.on('flip', e => updateIndicator(Number(e.data)||0));
        pageFlip.loadFromHTML(document.querySelectorAll('.page'));
        revealMobileUI();
      }catch(err){
        loading.textContent='페이지 넘김 모듈을 불러오지 못했습니다. 인터넷 연결을 확인해주세요.';
        console.error(err);
      }
    }

    document.getElementById('prevBtn').addEventListener('click',()=>{ if(pageFlip) pageFlip.flipPrev('top'); });
    document.getElementById('nextBtn').addEventListener('click',()=>{ if(pageFlip) pageFlip.flipNext('top'); });
    jumpInput.addEventListener('change',()=>{
      if(!pageFlip) return;
      const n=Math.max(1,Math.min(TOTAL,parseInt(jumpInput.value,10)||1));
      pageFlip.flip(n-1,'top');
    });
    document.getElementById('fullBtn').addEventListener('click',()=>{
      if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      else document.exitFullscreen?.();
    });
    document.addEventListener('keydown',e=>{
      if(!pageFlip) return;
      if(e.key==='ArrowRight') pageFlip.flipNext('top');
      if(e.key==='ArrowLeft') pageFlip.flipPrev('top');
    });
    document.getElementById('viewer').addEventListener('touchstart',revealMobileUI,{passive:true});
    window.addEventListener('orientationchange',()=>setTimeout(revealMobileUI,180));

    init();
  })();
  </script>
</body>
</html>
